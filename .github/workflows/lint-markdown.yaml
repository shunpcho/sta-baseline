name: Lint Markdown

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "**/*.md"
      - .github/workflows/lint-markdown.yaml

jobs:
  markdownlint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run prettier
        run: npx prettier@3.8.3 --check "**/*.md" --ignore-pattern ".venv/**"

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2@v24
        with:
          config: 'pyproject.toml'
          configPointer: '/tool/markdownlint-cli2'
          globs: '**/*.md'